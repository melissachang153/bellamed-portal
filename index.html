<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d7a7f">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://drive.google.com https://*.googleusercontent.com; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="寶漾行政系統">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>寶漾行政系統</title>
  <link rel="stylesheet" href="assets/style.css?v=2.1.0">
</head>
<body>
  <section id="loginView" hidden>
    <main>
      <div class="card login">
        <img class="login-logo" src="assets/logo.png" alt="BellaMed 寶漾">
        <label class="f" for="loginAcct">帳號</label>
        <input class="input" id="loginAcct" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="英文名字">
        <label class="f" for="loginPw">密碼</label>
        <input class="input" id="loginPw" type="password" autocomplete="current-password" maxlength="20">
        <div class="btn-row"><button class="btn block" id="loginBtn">登入</button></div>
        <div class="center"><button type="button" class="link-btn" id="forgotBtn">忘記密碼？</button></div>
      </div>
    </main>
  </section>

  <section id="pwView" hidden>
    <main>
      <div class="card login">
        <h2>設定新密碼</h2>
        <p class="muted small" id="pwHello"></p>
        <p class="small">為了帳號安全，第一次登入（或密碼被重設後）需要設定新密碼：</p>
        <ul class="small muted" id="pwRules"></ul>
        <label class="f" for="newPw">新密碼</label>
        <input class="input" id="newPw" type="password" autocomplete="new-password" maxlength="20">
        <label class="f" for="newPw2">再輸入一次</label>
        <input class="input" id="newPw2" type="password" autocomplete="new-password" maxlength="20">
        <div class="btn-row"><button class="btn block" id="newPwBtn">確定</button></div>
        <div class="center"><button type="button" class="link-btn" id="pwCancel">取消，回到登入</button></div>
      </div>
    </main>
  </section>

  <section id="appView" hidden>
    <header class="app-head">
      <button class="side-btn" id="sideBtn" aria-label="收合選單" title="收合選單"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <a class="brand" href="#/home"><img src="assets/logo-mark.png" alt=""><span>寶漾行政系統</span></a>
      <button class="user-btn" id="userBtn" aria-label="個人選單"><span class="avatar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></span><span id="who"></span><svg class="caret" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
    </header>
    <div class="layout">
      <nav class="side" id="sideNav" aria-label="功能選單"></nav>
      <div class="side-mask" id="sideMask"></div>
      <div class="main-col"><main class="content" id="content"></main></div>
    </div>
    <nav class="bottom-nav" id="bottomNav" aria-label="常用功能">
      <a href="#/home" data-r="home"><span>🏠</span>首頁</a>
      <a href="#/attendance/punch" data-r="attendance/punch"><span>⏰</span>打卡</a>
      <a href="#/attendance/leave" data-r="attendance/leave"><span>📅</span>請假</a>
      <a href="#/me" data-r="me"><span>👤</span>我的</a>
    </nav>
  </section>

  <div id="busy" hidden></div>
  <script src="assets/config.js?v=2.1.0"></script>
  <script src="assets/common.js?v=2.1.0"></script>
  <script src="assets/avatars.js?v=2.1.0"></script>
  <script src="assets/att-core.js?v=2.1.0"></script>
  <script src="assets/mod-events.js?v=2.1.0"></script>
  <script src="assets/mod-attendance.js?v=2.1.0"></script>
  <script src="assets/adm-events.js?v=2.1.0"></script>
  <script src="assets/adm-attendance.js?v=2.1.0"></script>
  <script src="assets/shell.js?v=2.1.0"></script>
</body>
</html>
