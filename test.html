<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d7a7f">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://drive.google.com https://*.googleusercontent.com; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="寶漾內部系統">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>寶漾內部系統・測試模式</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="test-mode">
  <div class="test-bar">🧪 測試模式：任選員工英文名登入、密碼一律 <b>test</b>。操作不會寫入正式資料。
    <button type="button" class="btn small ghost" id="testReset">重設測試資料</button>
    <button type="button" class="btn small ghost" id="testBack">回管理中心</button></div>
  <section id="loginView" hidden>
    <main>
      <div class="card login">
        <img class="login-logo" src="assets/logo.png" alt="BellaMed 寶漾">
        <h2 class="center">寶漾內部系統</h2>
        <label class="f" for="loginAcct">帳號</label>
        <input class="input" id="loginAcct" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="英文名字">
        <label class="f" for="loginPw">密碼</label>
        <input class="input" id="loginPw" type="password" autocomplete="off" maxlength="20">
        <label class="chk" style="margin-top:12px"><input type="checkbox" id="simFirst">模擬首次登入（需設定新密碼）</label>
        <div class="btn-row"><button class="btn block" id="loginBtn">登入</button></div>
        <div class="center"><button type="button" class="link-btn" id="forgotBtn">忘記密碼？</button></div>
      </div>
    </main>
  </section>

  <section id="pwView" hidden>
    <main>
      <div class="card login">
        <h2>設定新密碼</h2>
        <p class="muted small" id="pwHello"></p>
        <p class="small">為了帳號安全，第一次登入（或密碼被重設後）需要設定新密碼：</p>
        <ul class="small muted" id="pwRules"></ul>
        <label class="f" for="newPw">新密碼</label>
        <input class="input" id="newPw" type="password" autocomplete="off" maxlength="20">
        <label class="f" for="newPw2">再輸入一次</label>
        <input class="input" id="newPw2" type="password" autocomplete="off" maxlength="20">
        <div class="btn-row"><button class="btn block" id="newPwBtn">確定</button></div>
        <div class="center"><button type="button" class="link-btn" id="pwCancel">取消，回到登入</button></div>
      </div>
    </main>
  </section>

  <section id="appView" hidden>
    <header class="app-head">
      <a class="brand" href="#/home"><img src="assets/logo-mark.png" alt=""><span>寶漾內部系統（測試）</span></a>
      <button class="user-btn" id="userBtn" aria-label="個人選單"><span class="avatar">👤</span><span id="who"></span><span aria-hidden="true">▾</span></button>
    </header>
    <div class="layout">
      <nav class="side" id="sideNav" aria-label="功能選單"></nav>
      <main class="content" id="content"></main>
    </div>
    <nav class="bottom-nav" id="bottomNav" aria-label="常用功能">
      <a href="#/home" data-r="home"><span>🏠</span>首頁</a>
      <a href="#/attendance/punch" data-r="attendance/punch"><span>⏰</span>打卡</a>
      <a href="#/attendance/leave" data-r="attendance/leave"><span>📅</span>請假</a>
      <a href="#/me" data-r="me"><span>👤</span>我的</a>
    </nav>
  </section>

  <div id="busy" hidden></div>
  <script src="assets/config.js"></script>
  <script src="assets/test-boot.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/test.js"></script>
  <script src="assets/mod-events.js"></script>
  <script src="assets/adm-events.js"></script>
  <script src="assets/shell.js"></script>
</body>
</html>
